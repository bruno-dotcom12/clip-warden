# Build local, para quem desenvolve o agente em vez de usá-lo.
#
#   docker compose -f compose.yml -f compose.build.yml up --build -d
#
# Existe como arquivo separado, e não como `build:` ao lado de `image:` no
# compose principal, porque as duas chaves juntas fazem o compose construir
# sozinho quando a imagem não está local -- que é exatamente a máquina de quem
# acabou de instalar. O host puxa; quem desenvolve pede o build.
services:
  agent:
    build:
      context: .
      # SEM `args:`, e isso é a correção de um defeito.
      #
      # Até 15/09/2026 o cliente OAuth do Google entrava por build-arg aqui e no
      # `publish.yml`, e o Dockerfile o gravava como `ENV`. Numa imagem pública
      # isso é texto que qualquer pessoa lê com `docker image inspect`, e numa
      # imagem local é texto que fica na imagem e vaza no dia em que ela for
      # empurrada para algum lugar. A política III.D.1 do YouTube proíbe embutir
      # credencial de API em projeto de código aberto.
      #
      # A credencial agora entra em TEMPO DE EXECUÇÃO, pelo `environment:` do
      # compose.yml, igual para quem puxa a imagem e para quem a constrói. Este
      # arquivo não precisa saber que ela existe.
    image: clip-warden-agent:local
    pull_policy: never
