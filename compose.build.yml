# Build local, para quem desenvolve o agente em vez de usá-lo.
#
#   docker compose -f compose.yml -f compose.build.yml up --build -d
#
# Existe como arquivo separado, e não como `build:` ao lado de `image:` no
# compose principal, porque as duas chaves juntas fazem o compose construir
# sozinho quando a imagem não está local -- que é exatamente a máquina de quem
# acabou de instalar. O host puxa; quem desenvolve pede o build.
services:
  agent:
    build:
      context: .
      # Passados do ambiente de quem constrói, para o build local ter a mesma
      # capacidade que a imagem publicada. Sem eles, o build funciona e o
      # YouTube fica indisponível, dito em voz alta pelo `warden status`.
      args:
        WARDEN_YT_CLIENT_ID: ${WARDEN_YT_CLIENT_ID:-}
        WARDEN_YT_CLIENT_SECRET: ${WARDEN_YT_CLIENT_SECRET:-}
    image: clip-warden-agent:local
    pull_policy: never
