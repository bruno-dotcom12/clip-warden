# Publica a imagem no GHCR, para que a máquina de quem instala baixe em vez de
# construir.
#
# O build local custa ao host 4,68 GB de cache de build além da imagem, e faz de
# qualquer tropeço durante o build -- um apt-get que caiu, um wheel que saiu do
# PyPI -- uma instalação falha por um motivo que nunca foi dele. Um `docker pull`
# de 1,06 GB comprimidos troca as duas coisas.
#
# amd64 apenas, e isso não é escolha: a base `plow-cloud-agents` publica um
# manifesto único de uma arquitetura (verificado com `imagetools inspect --raw`:
# é `manifest.v2+json`, não um índice). Enquanto for assim, arm64 é impossível e
# num Apple Silicon a imagem roda emulada -- que é o que já acontece hoje.
name: publish image

on:
  push:
    branches: [main]
    # Uma tag `v1.2.3` publica `:v1.2.3` além de mover `:latest`. O gatilho de
    # tag precisa estar aqui: sem ele o `type=semver` do metadata-action é código
    # morto e não produz tag nenhuma, calado.
    tags: ['v*.*.*']
    # Filtro de caminho não é avaliado em push de tag, então isto vale só para o
    # push em main e não bloqueia o release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Para a atestação de proveniência: diz de qual commit e de qual workflow a
      # imagem saiu, que é o que um estranho não consegue verificar sozinho.
      id-token: write
      attestations: write

    steps:
      # Majors com runtime Node 24. O Node 20 sai dos runners em 23/09/2026 e,
      # depois disso, uma action presa nele falha ao carregar -- antes do build,
      # com um erro que não fala de Docker nenhum.
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Só a tag imutável por sha neste passo. `latest` é movida no fim, depois
      # da imagem passar na verificação -- ver o comentário lá embaixo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern=v{{version}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache no próprio registro, não no serviço de cache do Actions: a cota
          # ali é de 10 GB por repositório, `mode=max` exporta toda camada
          # intermediária, e uma imagem deste tamanho enche a cota em duas ou três
          # execuções. A partir daí cada run sobe GB que serão despejados antes do
          # run seguinte, e o cache vira custo puro.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,ignore-error=true
          provenance: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage record só existe para artefato de repositório de organização,
          # e este é de usuário. Deixado no padrão, o passo falha ao gravá-lo.
          create-storage-record: false

      # A imagem publicada tem de ter o detector de rosto funcionando. Sem esta
      # checagem, uma imagem quebrada chega à máquina de um host e o defeito
      # aparece como um clipe com o rosto na borda do quadro, não como um build
      # vermelho aqui.
      #
      # libass entra pelo mesmo motivo, com uma diferença: ele não degrada, ele
      # recusa. A legenda deste renderizador é ASS com destaque palavra a
      # palavra, e o filtro `ass` é opção de compilação do ffmpeg. Uma base que
      # perca o `--enable-libass` publica verde aqui e faz TODO corte com
      # legenda parar na máquina de quem instalou.
      - name: o que a imagem precisa ter
        run: |
          IMG="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python3 "$IMG" -c "
          import sys, os
          sys.path.insert(0, '/opt/hermes/skills/warden-shared/scripts')
          import warden_media as M, warden_style as S
          ok, why = M.face_detection_status()
          assert ok, 'sem detector de rosto: ' + why
          assert S.font_available(), 'sem a fonte Anton'
          assert M.ffmpeg_tem_filtro('ass'), 'este ffmpeg nao tem o filtro ass: sem libass nenhum corte queima legenda'
          assert os.path.isfile('/opt/hermes/skills/SPECS/estilo-aprovado-scenepack.json')
          import PIL, numpy, faster_whisper, yt_dlp
          print('ok:', why)
          "

      # Um pacote novo no GHCR nasce PRIVADO, mesmo num repositório público, e
      # este job continua autenticado -- então o `docker run` acima passa e todo
      # estranho que rodar `docker compose up` recebe `denied`. Um build verde
      # escondendo uma instalação quebrada é o pior resultado possível, então a
      # checagem é feita deslogado, como um estranho faria.
      #
      # Se falhar: a visibilidade se muda uma vez, à mão, em
      # github.com/users/<dono>/packages/container/<pacote>/settings.
      - name: puxável sem credencial nenhuma
        run: |
          docker logout ghcr.io
          docker manifest inspect \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" >/dev/null \
            || { echo "::error::o pacote está privado -- quem instalar recebe 'denied'. \
          Mude a visibilidade para Public nas settings do pacote." >&2; exit 1; }

      # `latest` só agora, e só a partir do branch padrão.
      #
      # Publicar `latest` junto com o build punha a imagem na frente dos hosts
      # ANTES da verificação: quando o teste do detector falhasse, `latest` já
      # apontava para a imagem quebrada havia minutos, e um build vermelho não
      # desfaz uma tag. `imagetools create` copia o manifesto sem reconstruir e
      # preserva o índice com a proveniência.
      - name: mover latest, verificada
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: digest
        run: |
          {
            echo "## imagem publicada"
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "O caminho cloud da Plow pede o digest, não a tag:"
            echo "\`provider=exe:ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
