services:
  agent:
    # A imagem publicada, não um build na máquina de quem instala.
    #
    # `docker compose up --build` custava ao host 4,68 GB de imagem MAIS 4,68 GB
    # de cache de build, e transformava qualquer tropeço de build -- um apt-get
    # que caiu, um wheel que saiu do PyPI -- numa instalação falha por um motivo
    # que não era dele. Puxar troca isso por 1,06 GB comprimidos.
    #
    # Para desenvolver, o build local continua a um arquivo de distância:
    #   docker compose -f compose.yml -f compose.build.yml up --build -d
    image: ${WARDEN_IMAGE:-ghcr.io/bruno-dotcom12/clip-warden:latest}
    pull_policy: ${WARDEN_PULL:-missing}
    environment:
      # The Agent Index project id this install reports to. Registered once by
      # the publisher; every installer reports to the same id. The reporter
      # stands down without it, so an install that never sets it never counts.
      AGENT_ID: ${AGENT_ID:-clip-warden}
      # O provedor de PO token NÃO é mais um container.
      #
      # Ele era um segundo serviço aqui embaixo, escutando a porta 4416, e
      # saiu em 16/09/2026: a nuvem da Plow roda um container por pessoa e
      # proíbe um listener de entrada, então o gerador passou a viver DENTRO
      # da imagem, em modo script (ver `vendor/potprovider.pin`). Quem instala
      # localmente também ganha: uma imagem a menos para puxar.
      #
      # `WARDEN_POT_URL` continua sendo lida. Declare-a se você tiver um
      # servidor de PO token próprio de pé; sem ela, vale o script da imagem.
      # Quantos clipes de um lote renderizam ao mesmo tempo. Dois, medido em
      # 16/09/2026: o lote de dois clipes levava 105s em fila e o render é o
      # que sobrou de lento depois que o download deixou de trazer o vídeo
      # inteiro. O container tem 8 CPUs e um render sozinho usava 278% delas.
      WARDEN_RENDER_PARALELO: ${WARDEN_RENDER_PARALELO:-2}
      # ── A REGRA DESTE BLOCO ────────────────────────────────────────────
      # O QUE ENTRA NA IMAGEM É PÚBLICO, porque este agente é publicado.
      # Credencial, cookie e chave de API entram da MÁQUINA DE QUEM INSTALA,
      # em tempo de execução, e a ausência de qualquer uma desliga só o recurso
      # dela -- nunca o boot.
      #
      # Isto não é cautela teórica: até 15/09/2026 o cliente OAuth do Google era
      # embutido na imagem por build-arg, e um `pull` ANÔNIMO do ghcr devolvia
      # `WARDEN_YT_CLIENT_SECRET` com valor. Já vazou uma vez.
      # ───────────────────────────────────────────────────────────────────

      # O cliente OAuth do Google, de quem instala e nunca da imagem.
      #
      # A política III.D.1 dos Serviços de API do YouTube proíbe, com essas
      # palavras, "embed your API Credentials in open source projects" -- e o
      # `ENV` de uma imagem pública é lido com um `docker image inspect`, ou
      # direto do registro, sem sequer baixar as camadas. Agora ele segue a
      # mesma regra do `plow-credentials`: é de UMA PESSOA, então entra da
      # máquina dela.
      #
      # De onde o compose lê: a variável exportada no shell, ou um arquivo
      # `.env` ao lado deste compose.yml -- que o compose lê sozinho, que já
      # está no `.gitignore` e no `.dockerignore`, e que é o lugar certo para um
      # segredo que não deve virar histórico de shell:
      #
      #   WARDEN_YT_CLIENT_ID=...apps.googleusercontent.com
      #   WARDEN_YT_CLIENT_SECRET=...
      #
      # AUSENTE É O ESTADO NORMAL, e degrada declaradamente: `:-` faz as duas
      # chegarem vazias em vez de faltarem, `warden_youtube` vê o par vazio e
      # só `warden youtube` recusa, nomeando as duas variáveis. O boot, o corte,
      # a legenda e a entrega não mudam. Ver docs/INSTALL.md.
      WARDEN_YT_CLIENT_ID: ${WARDEN_YT_CLIENT_ID:-}
      WARDEN_YT_CLIENT_SECRET: ${WARDEN_YT_CLIENT_SECRET:-}

      # A chave do intermediário de publicação, também de quem instala.
      #
      # `warden post youtube` fala com um serviço intermediário (Upload-Post)
      # cujo app JÁ passou pela auditoria do YouTube. É por isso que ele
      # publica de verdade: medido em 15/09/2026, com um envio real, a API do
      # YouTube devolveu `privacyStatus: public` e a página abre deslogada.
      # Isso é outra coisa de `warden youtube publish`, que usa o projeto de
      # API deste repositório, não auditado, e cujo envio fica TRANCADO como
      # privado. `warden post tiktok` e `warden post instagram` andam pela
      # mesma chave e pelo mesmo envio -- mas SÓ O YOUTUBE foi medido ponta a
      # ponta daqui, e o comando diz isso na saída de todo envio que inclui uma
      # das outras duas.
      #
      # A chave é de UMA PESSOA -- é a conta dela no intermediário, com o
      # limite e a fatura dela. Mesma regra do `plow-credentials` e do cliente
      # do Google: entra da máquina, nunca da imagem.
      #
      # ELA TEM DUAS ORIGENS, e o ambiente ganha do arquivo:
      #
      #   1. esta variável, que é como o DONO DO AGENTE põe a dele -- e aí
      #      VÁRIAS máquinas podem estar usando a MESMA conta;
      #   2. `echo "<chave>" | warden post setkey`, que lê a chave da entrada
      #      padrão (nunca de um argumento, que ficaria no `ps` e no histórico
      #      do shell) e grava em /var/lib/hermes/warden/post-api-key, 0600, do
      #      uid 10000. Esse é O CAMINHO NA NUVEM DA PLOW, onde não existe
      #      `.env` nem este arquivo: lá cada pessoa tem a própria máquina e o
      #      ambiente traz só o que a Plow põe nele, então sem esse comando a
      #      chave da PRÓPRIA PESSOA não teria por onde entrar. O arquivo mora
      #      no volume desta instalação, que não é a imagem: ele é escrito
      #      depois do pull e não viaja para quem puxa a mesma tag.
      #
      # A ordem não é arbitrária: a variável é a alavanca de quem está de pé
      # agora e tem de ganhar de um arquivo escrito semanas atrás. E a
      # PROCEDÊNCIA da chave decide outra coisa, logo abaixo.
      #
      # SEM NENHUMA DAS DUAS O COMANDO FICA DESLIGADO, e esse é o estado padrão
      # de quem instala: o agente entrega o arquivo na conversa e a pessoa sobe
      # pelo app. Nada mais muda.
      WARDEN_POST_API_KEY: ${WARDEN_POST_API_KEY:-}
      WARDEN_POST_PROVIDER: ${WARDEN_POST_PROVIDER:-upload-post}

      # O PERFIL, que na prática é O CANAL. Um perfil no intermediário é um
      # apelido para um conjunto de contas conectadas, e mandar para o perfil
      # errado é publicar no canal de outra pessoa -- o que não volta atrás.
      #
      # O padrão ERA `clip-warden`, IGUAL EM TODA INSTALAÇÃO, e isso era um
      # defeito com data marcada: com a chave do dono do agente no ambiente de
      # várias máquinas, todas elas resolveriam para o mesmo perfil, logo para
      # o mesmo canal. A primeira pessoa conectaria o canal dela e a segunda
      # publicaria lá dentro sem que nenhuma das duas tivesse pedido.
      #
      # Desde 16/09/2026, sem esta variável, cada instalação gera
      # `clip-warden-<8 hexadecimais>` na primeira vez que precisa de um nome,
      # grava em /var/lib/hermes/warden/post-profile e reusa sempre -- está no
      # volume porque um nome novo a cada boot seria um canal novo a cada boot.
      # A exceção: quando a chave veio do ARQUIVO (alguém a digitou NESTA
      # máquina, então a conta é dessa pessoa) e a conta tem exatamente UM
      # perfil, esse perfil é adotado, para uma instalação que já tinha canal
      # ligado não perder o canal.
      #
      # DECLARE-A SE VOCÊ JÁ TINHA UM CANAL CONECTADO ANTES DESSA MUDANÇA. Ela
      # ganha do nome gerado e da adoção, e é o que mantém esta máquina no
      # perfil de sempre; sem ela a máquina passa a usar um perfil novo, que
      # não tem canal nenhum atrás, e o canal teria de ser reconectado em
      # `warden post connect`. Na instalação local do dono o `.env` carrega
      # `WARDEN_POST_PROFILE=Clip-Warden` por exatamente esse motivo.
      WARDEN_POST_PROFILE: ${WARDEN_POST_PROFILE:-}

      # Onde o arquivo de cookies do YouTube está, quando existe.
      #
      # Só o CAMINHO passa por aqui. O arquivo mora num volume, montado pelo
      # `volumes:` abaixo, e nunca na imagem: ele é uma sessão logada de uma
      # pessoa, e uma sessão dentro de uma imagem publicada é uma sessão
      # publicada. Ver "Putting the cookies file in" em docs/INSTALL.md.
      WARDEN_YT_COOKIES: ${WARDEN_YT_COOKIES:-}
    volumes:
      # `.host`, not the path the agent reads: a bind carries this machine's
      # ownership in, and the image copies the file into place as root itself.
      #
      # Essa última oração era FALSA até 16/09/2026 e agora é verdadeira. Nem
      # esta imagem nem a base tinham a cópia; `plow-init` procurava
      # `/var/lib/plow/credentials`, não achava, esperava 60s e ESTACIONAVA
      # sem gateway -- uma instalação local nova subia sem erro na tela e não
      # respondia a ninguém. Quem funcionava tinha o arquivo posto à mão, numa
      # camada de escrita que morre no primeiro `--force-recreate`. O passo
      # está em `image/cont-init.d/005-plow-credential`, com o relato inteiro.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across up/down for its sessions, its campaigns
      # and the footage it has already pulled.
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

    # Measured, not guessed. On this machine, sampling `docker stats` once a
    # second through the heaviest thing this agent does -- a transcription and a
    # render at the same time -- the container peaked at 1815 MiB and 99 tasks,
    # against 277 MiB and 30 tasks at rest.
    #
    # This is not a tuning preference. The gateway's own ledger recorded a life
    # that "exited UNCLEANLY (no exit path ran -- SIGKILL / OOM / VM death)" on
    # 2026-09-12 with mem_total_kib=4012336, and an unbounded container on a
    # 3.8 GiB Docker VM can take the VM down with it rather than dying alone.
    # A limit turns "the machine froze" into "the agent restarted".
    #
    # Se o Docker Desktop tiver menos que isto, é este número que se abaixa, ou
    # a VM que se levanta -- dizer aqui custa uma linha e economiza um estranho
    # descobrindo por um kill.
    # 4g e não 3g desde 16/09/2026, e o motivo é o render em paralelo.
    # `WARDEN_RENDER_PARALELO=2` corta o tempo do lote pela metade, e dois
    # ffmpeg ao mesmo tempo não cabiam nos 3 GiB com folga nenhuma: o pico de
    # UM render com transcrição junto já era 1815 MiB. Velocidade que o OOM
    # killer interrompe não é velocidade.
    mem_limit: 4g
    mem_reservation: 768m

    # 99 tasks measured at peak; ffmpeg's threads are most of it. 512 is five
    # times that, which stops a fork bomb without being a number any honest
    # render can reach.
    pids_limit: 512

    # DISK IS NOT LIMITED HERE, and that is a finding rather than an omission.
    # `storage_opt: size` is accepted by this Docker and silently ignored --
    # with it set to 20G a probe container still reported 223.6G available,
    # because the containerd/overlayfs snapshotter on this host enforces no
    # quota. A limit that is quietly ignored is worse than none: it reads as
    # protection while the footage directory can still fill the host's disk.
    #
    # The cap that does hold is in the downloader: warden_media refuses a direct
    # download over MAX_DIRECT_BYTES. It is per file and it covers only the
    # direct path, so the two gaps are the total across an archive and the
    # gdown/yt-dlp paths. Those belong in the downloader, where they can be
    # enforced, and are tracked in the security pass rather than papered over
    # with a compose key that does nothing.

  # O PROVEDOR DE PO TOKEN ERA UM SERVIÇO AQUI, E SAIU EM 16/09/2026.
  #
  # O YouTube quer um PO token nas requisições de um cliente deslogado. Sem um,
  # a instalação parece um robô e o endereço de onde ela chama é marcado -- e a
  # partir daí NADA neste projeto puxa um link do YouTube. Não é hipótese: foi o
  # estado medido no endereço do próprio dono em 15/09/2026, e um token emitido
  # depois não levantou a marcação. O token tem de estar lá ANTES da marca.
  #
  # Isso não mudou. O que mudou foi ONDE ele é emitido. Era um sidecar Node
  # escutando 4416, escolhido para poder ser atualizado no calendário do YouTube
  # sem rebuild do agente. A nuvem da Plow roda UM container por pessoa e o
  # contrato dela proíbe, com essas palavras, "no inbound listener" -- então o
  # gerador passou para dentro da imagem, no modo SCRIPT do mesmo projeto: um
  # processo Node executado quando o yt-dlp precisa, e nenhuma porta aberta.
  #
  # O que se perde é a atualização independente: subir a versão do gerador agora
  # é um rebuild. O que se ganha é uma imagem a menos para quem instala, e a
  # única forma que cabe na nuvem. A versão continua pinada com sha256 em
  # `vendor/potprovider.pin`, plugin e gerador na mesma major -- 1.3.x continua
  # fora por causa do mesmo RCE (GHSA-qpv9-8xfj-xx9m).
  #
  # `WARDEN_POT_URL` continua sendo lida: declare-a se você tiver um servidor
  # próprio de pé e quiser que ele ganhe do script.

volumes:
  agent-home:
