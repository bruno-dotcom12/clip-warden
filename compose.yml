services:
  agent:
    # A imagem publicada, não um build na máquina de quem instala.
    #
    # `docker compose up --build` custava ao host 4,68 GB de imagem MAIS 4,68 GB
    # de cache de build, e transformava qualquer tropeço de build -- um apt-get
    # que caiu, um wheel que saiu do PyPI -- numa instalação falha por um motivo
    # que não era dele. Puxar troca isso por 1,06 GB comprimidos.
    #
    # Para desenvolver, o build local continua a um arquivo de distância:
    #   docker compose -f compose.yml -f compose.build.yml up --build -d
    image: ${WARDEN_IMAGE:-ghcr.io/bruno-dotcom12/clip-warden:latest}
    pull_policy: ${WARDEN_PULL:-missing}
    environment:
      # The Agent Index project id this install reports to. Registered once by
      # the publisher; every installer reports to the same id. The reporter
      # stands down without it, so an install that never sets it never counts.
      AGENT_ID: ${AGENT_ID:-clip-warden}
      # Where the Proof-of-Origin token provider answers. The service name
      # below, not localhost: the provider is a sibling container, and the
      # tool's own default (127.0.0.1) is for someone running it on the host.
      WARDEN_POT_URL: ${WARDEN_POT_URL:-http://pot:4416}
    depends_on:
      - pot
    volumes:
      # `.host`, not the path the agent reads: a bind carries this machine's
      # ownership in, and the image copies the file into place as root itself.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across up/down for its sessions, its campaigns
      # and the footage it has already pulled.
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

    # Measured, not guessed. On this machine, sampling `docker stats` once a
    # second through the heaviest thing this agent does -- a transcription and a
    # render at the same time -- the container peaked at 1815 MiB and 99 tasks,
    # against 277 MiB and 30 tasks at rest.
    #
    # This is not a tuning preference. The gateway's own ledger recorded a life
    # that "exited UNCLEANLY (no exit path ran -- SIGKILL / OOM / VM death)" on
    # 2026-09-12 with mem_total_kib=4012336, and an unbounded container on a
    # 3.8 GiB Docker VM can take the VM down with it rather than dying alone.
    # A limit turns "the machine froze" into "the agent restarted".
    #
    # 3g is 1.7x the measured peak, which is room for a longer source without
    # room for a runaway. If Docker Desktop is set to less than 4 GiB this is
    # the number to lower, or raise the VM -- the agent needs about 2 GiB to
    # transcribe and render at once, and saying so here beats a stranger
    # discovering it as a kill.
    mem_limit: 3g
    mem_reservation: 768m

    # 99 tasks measured at peak; ffmpeg's threads are most of it. 512 is five
    # times that, which stops a fork bomb without being a number any honest
    # render can reach.
    pids_limit: 512

    # DISK IS NOT LIMITED HERE, and that is a finding rather than an omission.
    # `storage_opt: size` is accepted by this Docker and silently ignored --
    # with it set to 20G a probe container still reported 223.6G available,
    # because the containerd/overlayfs snapshotter on this host enforces no
    # quota. A limit that is quietly ignored is worse than none: it reads as
    # protection while the footage directory can still fill the host's disk.
    #
    # The cap that does hold is in the downloader: warden_media refuses a direct
    # download over MAX_DIRECT_BYTES. It is per file and it covers only the
    # direct path, so the two gaps are the total across an archive and the
    # gdown/yt-dlp paths. Those belong in the downloader, where they can be
    # enforced, and are tracked in the security pass rather than papered over
    # with a compose key that does nothing.

  # The Proof-of-Origin token provider.
  #
  # YouTube now wants a PO token on requests from a logged-out client. Without
  # one an install looks like a bot, and the address it is calling from gets
  # flagged -- at which point NOTHING in this project can pull a YouTube link
  # any more. That is not a hypothesis: it is the state the owner's own address
  # was measured in on 15/09/2026, and a valid token minted afterwards did not
  # lift it. The token has to be there BEFORE the flag, which is why this is a
  # service and not a troubleshooting step.
  #
  # A sidecar rather than something baked into the agent image, on purpose:
  # this is a Node service with native dependencies that tracks YouTube's
  # BotGuard, it will need updating on YouTube's schedule rather than ours, and
  # 2.0.0 exists because 1.3.x had a remote code execution hole
  # (GHSA-qpv9-8xfj-xx9m). Keeping it separate means updating it never means
  # rebuilding the agent.
  #
  # NO `ports:` KEY, and that is the security control. The published advice is
  # `-p 127.0.0.1:4416:4416`; not publishing at all is strictly safer, because
  # then the provider is reachable only on this compose network -- by the agent
  # and by nothing else on the machine.
  pot:
    # Pinned by digest as well as tag, the same rule the agent's own base
    # follows: this service answers a request the agent makes on every
    # YouTube link, and a moving tag would substitute code underneath an
    # install without anybody reviewing it.
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0@sha256:ed86b6fdd5e430ddd7c8ce1adb55e1ab54db7c7dbc1bcbf3a82454a85b971164
    init: true
    restart: unless-stopped
    # It is a token minter, not a workload. Measured elsewhere it sits idle;
    # the limit is here so a leak in a third-party service cannot take the
    # host's Docker VM down with it, the same reason the agent has one.
    mem_limit: 512m
    pids_limit: 128

volumes:
  agent-home:
